services:
  kbs:
    build:
      context: .
      dockerfile: kbs/docker/coco-as-grpc/Dockerfile
    image: ghcr.io/sc2-sys/trustee:main
    command: [
        "${TRUSTEE_GUEST_BIN_MOUNT_DIR}/kbs",
        "--config-file",
        "/etc/kbs-config.toml",
      ]
    restart: always # keep the server running
    ports:
      - "${KBS_HOST_PORT:-8080}:8080"
    environment:
      - LOG_LEVEL=debug
    volumes:
      - ./kbs/data/kbs-storage:/opt/confidential-containers/kbs/repository:rw
      - ./kbs/data/nebula-ca:/opt/confidential-containers/kbs/nebula-ca:rw
      - ./kbs/config/docker-compose/kbs-config.toml:/etc/kbs-config.toml
      - ${TRUSTEE_HOST_CONFIG_DIR}/public.pub:/opt/confidential-containers/kbs/user-keys/public.pub
      - ${TRUSTEE_HOST_BIN_MOUNT_DIR}:${TRUSTEE_GUEST_BIN_MOUNT_DIR}
    depends_on:
    - as

  as:
    build:
      context: .
      dockerfile: attestation-service/docker/as-grpc/Dockerfile
    image: ghcr.io/sc2-sys/trustee:main
    ports:
      - "50004:50004"
    restart: always
    volumes:
      - ./kbs/data/attestation-service:/opt/confidential-containers/attestation-service:rw
      - ./kbs/config/as-config.json:/etc/as-config.json:rw
      - ./kbs/config/sgx_default_qcnl.conf:/etc/sgx_default_qcnl.conf:rw
      - ${TRUSTEE_HOST_BIN_MOUNT_DIR}:${TRUSTEE_GUEST_BIN_MOUNT_DIR}
    command: [
      "${TRUSTEE_GUEST_BIN_MOUNT_DIR}/grpc-as",
      "--socket",
      "0.0.0.0:50004",
      "--config-file",
      "/etc/as-config.json"
    ]
    depends_on:
    - rvps

  rvps:
    build:
      context: .
      dockerfile: rvps/docker/Dockerfile
    image: ghcr.io/sc2-sys/trustee:main
    restart: always # keep the server running
    ports:
      - "50003:50003"
    volumes:
      - ./kbs/data/reference-values:/opt/confidential-containers/attestation-service/reference_values:rw
      - ./kbs/config/rvps.json:/etc/rvps.json:rw
      - ${TRUSTEE_HOST_BIN_MOUNT_DIR}:${TRUSTEE_GUEST_BIN_MOUNT_DIR}
    command: [
      "${TRUSTEE_GUEST_BIN_MOUNT_DIR}/rvps",
      "--address",
      "0.0.0.0:50003"
    ]

  keyprovider:
    image: ghcr.io/confidential-containers/coco-keyprovider:latest
    restart: always
    ports:
      - "50000:50000"
    volumes:
      - ${TRUSTEE_HOST_CONFIG_DIR}/private.key:/etc/private.key
    command: [
      "coco_keyprovider",
      "--socket",
      "0.0.0.0:50000",
      "--kbs",
      "http://kbs:8080",
      "--auth-private-key",
      "/etc/private.key"
    ]
    depends_on:
    - kbs
